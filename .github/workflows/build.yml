name: Build and test standalone
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [README.md, docs/VALIDATION.md, docs/ARCHITECTURE.md]
  pull_request:
    paths-ignore: [README.md, docs/VALIDATION.md, docs/ARCHITECTURE.md]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish, for example v0.12.1. Empty does not publish."
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DFGA_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - run: mkdir -p build/midi && build/fga_core_tests build/midi && python3 scripts/verify-midi.py build/midi
      - run: python3 tests/test-packaging.py
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb ffmpeg
      - name: Validate family resources and Markdown guides
        run: python scripts/verify-family.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFGA_BUILD_HOST_TEST_PLUGIN=ON
      - name: Build
        id: nativebuild
        run: cmake --build build --config Release -j2
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: AI composition HTTP and cancellation integration
        run: python scripts/test-ai.py
      - name: Standalone rendering smoke test
        if: runner.os == 'Linux' && !cancelled() && steps.nativebuild.outcome == 'success'
        run: xvfb-run -a "build/FaseGrooveArranger_artefacts/Release/Fase Groove Arranger" --smoke-test "$RUNNER_TEMP/arranger-smoke"
      - name: Verify rendered audio
        if: runner.os == 'Linux' && !cancelled() && steps.nativebuild.outcome == 'success'
        run: python3 scripts/verify-audio.py "$RUNNER_TEMP/arranger-smoke"
      - name: Native VST3 instrument integration
        if: runner.os == 'Linux' && !cancelled() && steps.nativebuild.outcome == 'success'
        run: |
          xvfb-run -a "build/FaseGrooveArranger_artefacts/Release/Fase Groove Arranger" --host-smoke-test "build/ArrangerHostProbe_artefacts/Release/VST3/Arranger Host Probe.vst3" "$RUNNER_TEMP/arranger-smoke"
          python3 scripts/verify-host.py "$RUNNER_TEMP/arranger-smoke"
      - name: Recursive isolated plugin catalogue integration
        if: '!cancelled() && steps.nativebuild.outcome == ''success'''
        run: python scripts/test-plugin-catalog.py
      - name: Complete club arrangements and independent audio audit
        if: runner.os == 'Linux' && !cancelled() && steps.nativebuild.outcome == 'success'
        run: |
          xvfb-run -a "build/FaseGrooveArranger_artefacts/Release/Fase Groove Arranger" --club-audit "$RUNNER_TEMP/club-audit"
          python3 scripts/verify-club-audio.py "$RUNNER_TEMP/club-audit"
      - name: Sign macOS app as in the family
        if: runner.os == 'macOS' && !cancelled() && steps.nativebuild.outcome == 'success'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="build/FaseGrooveArranger_artefacts/Release/Fase Groove Arranger.app"
          if [ -z "$MACOS_CERTIFICATE" ]; then
            codesign --force --deep --sign - "$app"
          else
            keychain="$RUNNER_TEMP/signing.keychain-db"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p ci "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p ci "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$app"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$app"
          fi
          codesign --verify --deep --strict "$app"
      - name: Package native distribution with source and licence notices
        if: '!cancelled() && steps.nativebuild.outcome == ''success'''
        env:
          FGA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/package.py
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows' && !cancelled() && steps.nativebuild.outcome == 'success'
        shell: pwsh
        run: |
          python -m pip install Pillow
          python installer/windows/make-assets.py
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(FaseGrooveArranger VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $package = (Resolve-Path dist/package).Path
          if (-not $package) { throw 'Tested native package is missing' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "/DPackageDir=$package" "/DRepoDir=$env:GITHUB_WORKSPACE" installer/windows/FaseGrooveArranger.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-installer.ps1
          Copy-Item installer-output/FaseGrooveArranger-Windows-Setup.exe dist/
      - uses: actions/upload-artifact@v4
        if: '!cancelled() && steps.nativebuild.outcome == ''success'''
        with:
          name: FaseGrooveArranger-${{ runner.os }}
          path: |
            dist/FaseGrooveArranger-${{ runner.os }}.zip
            dist/FaseGrooveArranger-Windows-Setup.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: Arranger-validation
          path: |
            ${{ runner.temp }}/arranger-smoke/
            ${{ runner.temp }}/club-audit/
            ${{ runner.temp }}/plugin-catalog/plugin-catalog.txt
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux' && failure()
        with:
          name: Arranger-validation-${{ runner.os }}
          path: ${{ runner.temp }}/plugin-catalog/plugin-catalog.txt

  release:
    name: Publish release
    needs: standalone
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FaseGrooveArranger-*
          path: packages
          merge-multiple: true
      - name: Release notes from the changelog
        run: .github/scripts/release-notes.sh "${{ inputs.release_tag || github.ref_name }}" > release-notes.md
      - name: Publish only the four distribution packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -f packages/FaseGrooveArranger-Linux.zip
          test -f packages/FaseGrooveArranger-macOS.zip
          test -f packages/FaseGrooveArranger-Windows.zip
          test -f packages/FaseGrooveArranger-Windows-Setup.exe
          extras=$(find packages -type f ! -name 'FaseGrooveArranger-Linux.zip' ! -name 'FaseGrooveArranger-macOS.zip' ! -name 'FaseGrooveArranger-Windows.zip' ! -name 'FaseGrooveArranger-Windows-Setup.exe' -print)
          if [ -n "$extras" ]; then echo "$extras" >&2; exit 1; fi
          gh release create "$TAG" --target "${{ github.sha }}" --title "Fase Groove Arranger ${TAG#v}" --notes-file release-notes.md \
            packages/FaseGrooveArranger-Linux.zip \
            packages/FaseGrooveArranger-macOS.zip \
            packages/FaseGrooveArranger-Windows.zip \
            packages/FaseGrooveArranger-Windows-Setup.exe || \
          gh release upload "$TAG" --clobber \
            packages/FaseGrooveArranger-Linux.zip \
            packages/FaseGrooveArranger-macOS.zip \
            packages/FaseGrooveArranger-Windows.zip \
            packages/FaseGrooveArranger-Windows-Setup.exe
