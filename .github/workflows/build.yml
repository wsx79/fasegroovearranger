name: Build and test standalone
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [README.md, docs/VALIDATION.md, docs/ARCHITECTURE.md]
  pull_request:
    paths-ignore: [README.md, docs/VALIDATION.md, docs/ARCHITECTURE.md]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish, for example v0.12.1. Empty does not publish."
        required: false
        type: string
      full_suite:
        description: "Run the slow audits (VST3 host, plugin catalogue, club audio) too."
        required: false
        type: boolean
        default: false
  schedule:
    # Nightly full audit: the release gate stays fast.
    - cron: "17 3 * * *"
permissions:
  contents: read
# Heavy audio audits run nightly and on demand. Plugin catalogue checks also
# gate releases. Set full_suite on a manual run to force every audit.
env:
  FULL_SUITE: ${{ github.event_name == 'schedule' || inputs.full_suite }}
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  family:
    name: Verify pinned family module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify module inventory and translation keys
        run: |
          python3 ThirdParty/fasegroove-common/VerifyModule.py
          python3 ThirdParty/fasegroove-common/CheckTranslations.py
      - name: Read canonical revision
        id: pin
        run: python3 -c "import json, os; p=json.load(open('ThirdParty/fasegroove-common.lock.json')); print('revision=' + p['revision'], file=open(os.environ['GITHUB_OUTPUT'], 'a'))"
      - uses: actions/checkout@v4
        with:
          repository: wsx79/fasegroove
          ref: ${{ steps.pin.outputs.revision }}
          path: .canonical-family
          persist-credentials: false
      - name: Compare with pinned canonical source
        run: python3 .canonical-family/common/VerifyModule.py --module ThirdParty/fasegroove-common --canonical .canonical-family
      - name: Read pinned engine revisions
        id: engines
        run: python3 -c "import os; p=dict(line.split() for line in open('ThirdParty/ENGINE_VERSIONS') if line.strip() and not line.startswith('#')); f=open(os.environ['GITHUB_OUTPUT'],'a'); [print(k+'='+v,file=f) for k,v in p.items()]"
      - uses: actions/checkout@v4
        with:
          repository: wsx79/fasegroovepiano
          ref: ${{ steps.engines.outputs.fasegroovepiano }}
          path: .engine-repos/fasegroovepiano
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wsx79/fasegroovedrums
          ref: ${{ steps.engines.outputs.fasegroovedrums }}
          path: .engine-repos/fasegroovedrums
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wsx79/fasegrooveguitar
          ref: ${{ steps.engines.outputs.fasegrooveguitar }}
          path: .engine-repos/fasegrooveguitar
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: wsx79/fasegroovelead
          ref: ${{ steps.engines.outputs.fasegroovelead }}
          path: .engine-repos/fasegroovelead
          persist-credentials: false
      - name: Verify vendored engines and recorded adaptations
        run: python3 scripts/sync-engines.py --check --repos .engine-repos
  core:
    needs: family
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DFGA_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
      - run: mkdir -p build/midi && build/fga_core_tests build/midi && python3 scripts/verify-midi.py build/midi
      - run: python3 tests/test-packaging.py
  standalone:
    needs: family
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb ffmpeg
      - name: Validate family resources and Markdown guides
        run: python scripts/verify-family.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFGA_BUILD_HOST_TEST_PLUGIN=ON
      - name: Build
        id: nativebuild
        run: cmake --build build --config Release -j2
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: AI composition HTTP and cancellation integration
        run: python scripts/test-ai.py
      - name: Native local AI composer flow
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/test-ai.py --ui-output "$RUNNER_TEMP/ai-ui"
      - name: Windows MP3 verification dependency
        if: runner.os == 'Windows' && !cancelled() && steps.nativebuild.outcome == 'success'
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Native UI and PCM/MP3 rendering smoke test
        id: nativesmoke
        # macOS only builds, signs and packages: the runtime harness (synthetic
        # input, pixel layouts, render checks) is verified on Linux and Windows.
        if: '!cancelled() && runner.os != ''macOS'' && steps.nativebuild.outcome == ''success'''
        run: python scripts/test-native-render.py
      - name: Native VST3 effects, automation and state integration
        if: '!cancelled() && steps.nativebuild.outcome == ''success'''
        run: python scripts/test-native-effects.py
      - name: Native VST3 instruments and legacy project Play integration
        id: nativehost
        if: '!cancelled() && steps.nativebuild.outcome == ''success'''
        run: python scripts/test-native-host.py
      - name: Recursive isolated plugin catalogue integration
        if: "!cancelled() && steps.nativebuild.outcome == 'success' && (env.FULL_SUITE == 'true' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))"
        run: python scripts/test-plugin-catalog.py
      - name: Complete offline club arrangements and independent audio audit
        if: '!cancelled() && steps.nativebuild.outcome == ''success'' && (steps.nativesmoke.outcome == ''success'' || runner.os == ''macOS'') && env.FULL_SUITE == ''true'''
        run: python scripts/test-offline-audio.py
      - name: Sign macOS app as in the family
        if: runner.os == 'macOS' && !cancelled() && steps.nativebuild.outcome == 'success'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="build/FaseGrooveArranger_artefacts/Release/Fase Groove Arranger.app"
          if [ -z "$MACOS_CERTIFICATE" ]; then
            codesign --force --deep --sign - "$app"
          else
            keychain="$RUNNER_TEMP/signing.keychain-db"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p ci "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p ci "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$app"
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$app"
          fi
          codesign --verify --deep --strict "$app"
      - name: Package native distribution with source and licence notices
        if: '!cancelled() && steps.nativebuild.outcome == ''success'''
        env:
          FGA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/package.py
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows' && !cancelled() && steps.nativebuild.outcome == 'success'
        shell: pwsh
        run: |
          python -m pip install Pillow
          python installer/windows/make-assets.py
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(FaseGrooveArranger VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $package = (Resolve-Path dist/package).Path
          if (-not $package) { throw 'Tested native package is missing' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "/DPackageDir=$package" "/DRepoDir=$env:GITHUB_WORKSPACE" installer/windows/FaseGrooveArranger.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-installer.ps1
          Copy-Item installer-output/FaseGrooveArranger-Windows-Setup.exe dist/
      - uses: actions/upload-artifact@v4
        if: '!cancelled() && steps.nativebuild.outcome == ''success'''
        with:
          name: FaseGrooveArranger-${{ runner.os }}
          path: |
            dist/FaseGrooveArranger-${{ runner.os }}.zip
            dist/FaseGrooveArranger-Windows-Setup.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Arranger-validation-${{ runner.os }}
          path: |
            ${{ runner.temp }}/arranger-smoke/
            ${{ runner.temp }}/ai-ui/
            ${{ runner.temp }}/club-audit/
            ${{ runner.temp }}/native-host/
            ${{ runner.temp }}/native-effects/
            ${{ runner.temp }}/plugin-catalog/plugin-catalog.txt

  release:
    name: Publish release
    needs: [family, core, standalone]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: FaseGrooveArranger-*
          path: packages
          merge-multiple: true
      - name: Release notes from the changelog
        run: .github/scripts/release-notes.sh "${{ inputs.release_tag || github.ref_name }}" > release-notes.md
      - name: Publish only the four distribution packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -f packages/FaseGrooveArranger-Linux.zip
          test -f packages/FaseGrooveArranger-macOS.zip
          test -f packages/FaseGrooveArranger-Windows.zip
          test -f packages/FaseGrooveArranger-Windows-Setup.exe
          extras=$(find packages -type f ! -name 'FaseGrooveArranger-Linux.zip' ! -name 'FaseGrooveArranger-macOS.zip' ! -name 'FaseGrooveArranger-Windows.zip' ! -name 'FaseGrooveArranger-Windows-Setup.exe' -print)
          if [ -n "$extras" ]; then echo "$extras" >&2; exit 1; fi
          gh release create "$TAG" --target "${{ github.sha }}" --title "Fase Groove Arranger ${TAG#v}" --notes-file release-notes.md \
            packages/FaseGrooveArranger-Linux.zip \
            packages/FaseGrooveArranger-macOS.zip \
            packages/FaseGrooveArranger-Windows.zip \
            packages/FaseGrooveArranger-Windows-Setup.exe || \
          gh release upload "$TAG" --clobber \
            packages/FaseGrooveArranger-Linux.zip \
            packages/FaseGrooveArranger-macOS.zip \
            packages/FaseGrooveArranger-Windows.zip \
            packages/FaseGrooveArranger-Windows-Setup.exe
